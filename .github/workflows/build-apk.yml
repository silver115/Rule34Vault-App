name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm install -g eas-cli
    - run: eas build --platform android --profile preview --non-interactive
      env:
        EXPO_PUBLIC_REC_SERVER_URL: ${{ secrets.REC_SERVER_URL }}
        REC_SERVER_URL: ${{ secrets.REC_SERVER_URL }}
        PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
        PUSH_ENCRYPTION_KEY: ${{ secrets.PUSH_ENCRYPTION_KEY }}
        PUSH_SERVER_PORT: 4829
        PUSH_POLL_INTERVAL: 300000
        CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        EXPO_OWNER: puro115
        ANDROID_PACKAGE: com.puro115.rule34vaultapp
    - uses: actions/upload-artifact@v4
      with:
        name: apk
        path: build-*.apk
